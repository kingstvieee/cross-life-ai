name: Native Check-in Compile
on:
  # Validate native iOS compilation directly in GitHub; no local Expo login is required.
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - 'frontend/app.json'
      - 'frontend/eas.json'
      - 'frontend/metro.config.js'
      - 'frontend/tsconfig.json'
      - 'frontend/.npmrc'
      - 'frontend/scripts/verify-native-targets.cjs'
      - 'frontend/modules/staar-watch/**'
      - 'frontend/src/checkins.ts'
      - 'frontend/scene-src/**'
      - 'frontend/components/staarwardd/world-scene*'
      - 'frontend/src/guardian-armor-lock.ts'
      - 'frontend/src/server-speech.ts'
      - 'frontend/src/guardian-speech-clip.ts'
      - 'frontend/src/guardian-alignment-client.ts'
      - 'frontend/src/guardian-visemes.ts'
      - 'frontend/lib/staarwardd/audio-provider.tsx'
      - 'frontend/components/staarwardd/startup-film-player.tsx'
      - 'frontend/components/staarwardd/startup-approved-soundtrack-source.ts'
      - 'frontend/components/staarwardd/startup-audio-gate.ts'
      - 'frontend/scripts/stage-approved-startup-audio.mjs'
      - 'frontend/scripts/prepare-private-eas-archive.mjs'
      - 'frontend/scripts/verify-approved-soundtrack.mjs'
      - 'frontend/tests/startup-audio-gate.test.mjs'
      - 'frontend/app/checkins.tsx'
      - 'frontend/scripts/build-ios-simulator.cjs'
      - '.github/workflows/native-checkins.yml'
# Only the newest source revision requires the expensive unsigned macOS
# simulator compile. Superseded pull-request runs never need to compete for
# runners or queue behind their own older versions. Expo EAS is never invoked.
concurrency:
  group: native-checkin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unsigned-ios:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: node node_modules/@shopify/react-native-skia/scripts/install-libs.js
      # The nine-world runtime is generated and gitignored; create it before TypeScript checks.
      - run: yarn scene:build
      - run: yarn exec tsc --noEmit
      - run: yarn expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: frontend/ios
      - run: node scripts/verify-native-targets.cjs
      - run: node scripts/build-ios-simulator.cjs
