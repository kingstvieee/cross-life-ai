name: Expo SDK 57 Dependency Lockfile Repair

# One-purpose, branch-isolated maintenance. No Expo EAS build or Apple release.
on:
  push:
    branches:
      - fix/expo-sdk57-doctor-compat-20261117
    paths:
      - frontend/package.json
      - frontend/yarn.lock
      - .github/workflows/expo-sdk57-lockfile-repair.yml

permissions:
  contents: write

concurrency:
  group: expo-sdk57-doctor-lock-refresh
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly this repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Install supported Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Enable pinned Yarn Classic
        run: corepack enable
      - name: Resolve the updated SDK 57 package dependencies and regenerate Yarn lockfile
        working-directory: frontend
        run: |
          set -eu
          yarn install --ignore-scripts --non-interactive --network-timeout 120000
      - name: Confirm installed versions match Expo SDK
        working-directory: frontend
        run: |
          set -eu
          CI=1 yarn expo install --check
          CI=1 yarn expo-doctor
      - name: Commit only regenerated lockfile on this isolated branch
        run: |
          set -eu
          git diff --check
          git add frontend/yarn.lock
          if git diff --cached --quiet; then
            echo 'No Yarn lockfile changes were required'
            exit 0
          fi
          git config user.name "STAARWAARDD dependency maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Yarn lockfile for Expo SDK 57 doctor-compatible versions"
          git push origin "HEAD:fix/expo-sdk57-doctor-compat-20261117"
