name: Guardian Core CI

on:
  pull_request:
    paths:
      - 'backend/guardian_core.py'
      - 'backend/test_guardian_core.py'
      - '.github/workflows/guardian-core-ci.yml'
  push:
    branches:
      - guardian-core-product-clean
    paths:
      - 'backend/guardian_core.py'
      - 'backend/test_guardian_core.py'
      - '.github/workflows/guardian-core-ci.yml'

jobs:
  guardian-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-xdist
      - name: Compile Guardian Core
        run: python -m py_compile guardian_core.py test_guardian_core.py
      - name: Run Guardian Core tests
        run: python -m pytest test_guardian_core.py
