name: Guardian Activation CI

on:
  pull_request:
    paths:
      - 'backend/guardian_core.py'
      - 'backend/guardian_store.py'
      - 'backend/guardian_routes.py'
      - 'backend/test_guardian_core.py'
      - 'backend/test_guardian_store.py'
      - 'backend/test_guardian_routes.py'
      - '.github/workflows/guardian-activation-ci.yml'
  push:
    branches:
      - guardian-core-activation
    paths:
      - 'backend/guardian_core.py'
      - 'backend/guardian_store.py'
      - 'backend/guardian_routes.py'
      - 'backend/test_guardian_core.py'
      - 'backend/test_guardian_store.py'
      - 'backend/test_guardian_routes.py'
      - '.github/workflows/guardian-activation-ci.yml'

jobs:
  guardian-activation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-xdist fastapi==0.110.1 httpx==0.28.1
      - name: Compile Guardian modules
        run: python -m py_compile guardian_core.py guardian_store.py guardian_routes.py test_guardian_core.py test_guardian_store.py test_guardian_routes.py
      - name: Run Guardian focused tests
        run: python -m pytest test_guardian_core.py test_guardian_store.py test_guardian_routes.py
