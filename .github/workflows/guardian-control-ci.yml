name: Guardian Trust and Loop Simulation

on:
  push:
    branches: [main, 'codex/guardian-trust-loop-*']
    paths: ['backend/guardian_*', 'backend/test_guardian_*', '.github/workflows/guardian-control-ci.yml']
  pull_request:
    paths: ['backend/guardian_*', 'backend/test_guardian_*', '.github/workflows/guardian-control-ci.yml']

permissions:
  contents: read

jobs:
  guardian-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install pytest pytest-xdist fastapi==0.110.1 httpx==0.28.1
      - name: Compile authority and loop runtime
        run: python -m py_compile guardian_control.py guardian_control_store.py guardian_control_routes.py guardian_server_integration.py server.py
      - name: Test simulation authorization and existing Guardian integration
        run: python -m pytest test_guardian_control.py test_guardian_core.py test_guardian_store.py test_guardian_routes.py test_guardian_server_integration.py -q
