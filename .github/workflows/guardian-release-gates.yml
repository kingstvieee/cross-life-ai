name: Guardian Release Gates
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/guardian-release-gates.yml'
permissions:
  contents: read
jobs:
  security-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-xdist fastapi==0.110.1 httpx==0.28.1
      - run: python -m compileall -q backend
      - run: python -m pytest -q backend/test_guardian_*.py
  web-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn exec tsc --noEmit
      - run: yarn expo export --platform web --no-bytecode
