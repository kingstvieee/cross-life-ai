name: Guardian Release Gates
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/guardian-release-gates.yml'
permissions:
  contents: read
jobs:
  security-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-xdist fastapi==0.110.1 httpx==0.28.1 python-multipart==0.0.32
      - run: python -m compileall -q backend
      - run: python -m pytest -q backend/test_guardian_*.py backend/test_identity_routes.py backend/test_conversation_history.py
  web-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: node --test tests/account-storage.test.mjs
      - run: yarn exec tsc --noEmit
      - run: yarn expo export --platform web --no-bytecode
