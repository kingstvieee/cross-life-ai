name: Guardian foundation tests

on:
  pull_request:
    paths:
      - "backend/guardian_*.py"
      - "backend/tests/test_guardian_*.py"
      - ".github/workflows/guardian-tests.yml"
  push:
    branches:
      - guardian-757-foundation-20261121
    paths:
      - "backend/guardian_*.py"
      - "backend/tests/test_guardian_*.py"
      - ".github/workflows/guardian-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017/tcp
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "pytest-xdist>=3,<4" "pymongo>=4,<5" "motor>=3,<4" "fastapi>=0.110,<1" "httpx>=0.27,<1"
      - name: Compile Guardian modules
        run: python -m compileall -q guardian_mission_engine.py guardian_worker.py guardian_verifier.py guardian_scheduler.py guardian_scheduler_service.py guardian_mission_routes.py guardian_mission_preview.py guardian_preview_service.py
      - name: Run Guardian foundation tests
        run: python -m pytest -q tests/test_guardian_mission_engine.py tests/test_guardian_evidence_regression.py tests/test_guardian_worker.py tests/test_guardian_verifier.py tests/test_guardian_recovery_safety.py tests/test_guardian_scheduler.py tests/test_guardian_mission_routes.py tests/test_guardian_preview.py
      - name: Verify recovery against MongoDB
        env:
          GUARDIAN_TEST_MONGO_URL: mongodb://127.0.0.1:${{ job.services.mongo.ports[27017] }}
        run: python -m pytest -q tests/test_guardian_mongo_recovery.py tests/test_guardian_mongo_preview.py
