name: Guardian foundation tests

on:
  pull_request:
    paths:
      - "backend/guardian_*.py"
      - "backend/tests/test_guardian_*.py"
      - ".github/workflows/guardian-tests.yml"
  push:
    branches:
      - guardian-757-foundation-20261121
    paths:
      - "backend/guardian_*.py"
      - "backend/tests/test_guardian_*.py"
      - ".github/workflows/guardian-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: guardian_test_admin
          MONGO_INITDB_ROOT_PASSWORD: guardian_fixture_only
        options: >-
          --health-cmd "mongosh --quiet --username guardian_test_admin --password guardian_fixture_only --authenticationDatabase admin --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s --health-timeout 4s --health-retries 10
        ports:
          - 27017/tcp
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "pytest-xdist>=3,<4" "pymongo>=4,<5" "motor>=3,<4" "fastapi>=0.110,<1" "httpx>=0.27,<1" "cryptography==50.0.0"
      - name: Compile Guardian modules
        run: python -m compileall -q guardian_mission_engine.py guardian_worker.py guardian_verifier.py guardian_scheduler.py guardian_scheduler_service.py guardian_mission_routes.py guardian_mission_preview.py guardian_preview_service.py guardian_notice_store.py guardian_notice_service.py guardian_notice_routes.py guardian_notice_relay.py guardian_notice_permissions.py guardian_staging_manifest.py guardian_staging_evidence.py guardian_staging_capture.py guardian_staging_sampler.py guardian_staging_review.py guardian_staging_handoff.py guardian_staging_readiness.py guardian_staging_closeout.py
      - name: Run Guardian foundation tests
        run: python -m pytest -q tests/test_guardian_mission_engine.py tests/test_guardian_evidence_regression.py tests/test_guardian_worker.py tests/test_guardian_verifier.py tests/test_guardian_recovery_safety.py tests/test_guardian_scheduler.py tests/test_guardian_mission_routes.py tests/test_guardian_preview.py tests/test_guardian_staging_evidence.py tests/test_guardian_staging_review.py tests/test_guardian_staging_handoff.py tests/test_guardian_staging_readiness.py tests/test_guardian_staging_closeout.py
      - name: Verify recovery against MongoDB
        env:
          GUARDIAN_TEST_MONGO_URL: mongodb://guardian_test_admin:guardian_fixture_only@127.0.0.1:${{ job.services.mongo.ports[27017] }}/?authSource=admin
          GUARDIAN_TEST_MONGO_AUTH: "true"
        run: python -m pytest -q tests/test_guardian_mongo_recovery.py tests/test_guardian_mongo_preview.py tests/test_guardian_notices.py tests/test_guardian_staging_capture.py
