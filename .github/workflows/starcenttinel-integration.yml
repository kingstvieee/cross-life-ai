name: StarCenttinel canonical integration checks
on:
  pull_request:
    paths:
      - 'backend/starcenttinel_gate.py'
      - 'backend/tests/test_starcenttinel_gate.py'
      - 'backend/guardian_routes.py'
      - '.github/workflows/starcenttinel-integration.yml'
  push:
    branches: [feature/starcenttinel-guardian-gates]
permissions:
  contents: read
jobs:
  sentinel-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-asyncio fastapi==0.110.1
      - run: python -m compileall -q backend/starcenttinel_gate.py backend/guardian_routes.py
      - run: PYTHONPATH=backend python -m pytest -q backend/tests/test_starcenttinel_gate.py
