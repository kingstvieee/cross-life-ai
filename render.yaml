# STAARWAARDD Guardian backend — Render Blueprint, preview only.
# Source: integration/final-3d-hub. No production secrets in Git.
services:
  - type: web
    name: staarwardd-guardian-preview
    runtime: docker
    plan: free
    branch: integration/final-3d-hub
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    autoDeployTrigger: off
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: staarwardd_guardian_preview
      - key: GUARDIAN_GITHUB_REPO
        value: kingstvieee/cross-life-ai
      - key: GUARDIAN_GITHUB_READ_TOKEN
        sync: false
      - key: GUARDIAN_PREVIEW_ENABLED
        value: "false"
      - key: ENABLE_LEGACY_EMERGENT_AUTH
        value: "false"
      - key: AUTH_NATIVE_REDIRECT_URL
        value: frontend://auth-complete
      - key: AUTH_AUTHORIZE_URL
        value: https://staarwaardd-hub.ca.auth0.com/authorize
      - key: AUTH_TOKEN_URL
        value: https://staarwaardd-hub.ca.auth0.com/oauth/token
      - key: AUTH_USERINFO_URL
        value: https://staarwaardd-hub.ca.auth0.com/userinfo
      - key: AUTH_ISSUER
        value: https://staarwaardd-hub.ca.auth0.com/
      - key: AUTH_CLIENT_ID
        value: NPH9YdToBxHPTZliONuwNMlsqDAibQlP
      - key: AUTH_CLIENT_SECRET
        sync: false
      - key: AUTH_CALLBACK_URL
        value: https://staarwardd-guardian-preview.onrender.com/api/auth/callback
      - key: AUTH_APP_URL
        value: https://staarwardd-guardian-preview.onrender.com
      - key: AUTH_CONNECTION_GOOGLE
        value: google-oauth2
      - key: AUTH_CONNECTION_EMAIL
        value: Username-Password-Authentication
# Deployment requires authorized Render account and securely entered values.
# MongoDB must be reachable from Render. Do not reuse production database for preview.
# Native PKCE redirect matches Expo; client secret is provided only in Render.
# Auth0's Google developer keys are QA-only; use provider-owned OAuth keys for release.
# Microsoft must remain disabled until its Azure app credentials are verified.
