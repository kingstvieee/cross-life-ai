name: STAAR Hub TestFlight Release

on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        description: Confirm the approved production TestFlight candidate
        required: true
        options:
          - 1.0.4 (105)

concurrency:
  group: staar-hub-testflight-release
  cancel_in_progress: false

jobs:
  build_ios:
    name: Build STAAR Hub 1.0.4 (105)
    type: build
    params:
      platform: ios
      profile: production
      message: STAAR Hub 1.0.4 (105) portal connections and device checks

  submit_ios:
    name: Submit build 105 to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      changelog: Life Map notes with provenance and correction/deletion, privacy-aware Guardian context, opt-in arrival greetings with delivery receipts, quiet/private controls, native daily check-ins, and existing Home Assistant light readback. Voice server credentials and physical-device verification remain required. Other provider buttons open external tools and do not claim account sync.
