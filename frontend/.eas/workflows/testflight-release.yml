name: STAAR Hub TestFlight Release

on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        description: Confirm the approved production TestFlight candidate
        required: true
        options:
          - 1.0.3 (104)

concurrency:
  group: staar-hub-testflight-release
  cancel_in_progress: false

jobs:
  build_ios:
    name: Build STAAR Hub 1.0.3 (104)
    type: build
    params:
      platform: ios
      profile: production
      message: STAAR Hub 1.0.3 (104) portal connections and device checks

  submit_ios:
    name: Submit build 104 to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      changelog: Portal connection setup, external tool handoffs, Home Assistant readback and explicit light controls, secure on-device home credentials, and clearer voice/microphone checks. Voice server credentials and physical-device verification remain required. Other provider buttons open external tools and do not claim account sync.
