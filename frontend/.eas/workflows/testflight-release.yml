name: STAAR Hub TestFlight Release

on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        description: Confirm the approved production TestFlight candidate
        required: true
        options:
          - 1.0.4 (116)

concurrency:
  group: staar-hub-testflight-release
  cancel_in_progress: false

jobs:
  preflight:
    name: Verify locked production package
    steps:
      - uses: eas/checkout
      - name: Check production artwork and Apple release identity
        run: |
          if [ -f scripts/verify-production-package.mjs ]; then
            node scripts/verify-production-package.mjs
          elif [ -f frontend/scripts/verify-production-package.mjs ]; then
            cd frontend && node scripts/verify-production-package.mjs
          else
            echo 'Production package preflight is missing' >&2
            exit 1
          fi

  build_ios:
    needs: [preflight]
    name: Build STAAR Hub 1.0.4 (116)
    type: build
    params:
      platform: ios
      profile: production
      message: STAAR Hub 1.0.4 (116) portal connections and device checks

  founder_acceptance:
    name: Founder approves tested, signed Build 116
    needs: [build_ios]
    type: require-approval

  submit_ios:
    name: Submit build 116 to TestFlight
    needs: [build_ios, founder_acceptance]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      changelog: Life Map notes with provenance and correction/deletion, privacy-aware Guardian context, opt-in arrival greetings with delivery receipts, quiet/private controls, native daily check-ins, and existing Home Assistant light readback. Voice server credentials and physical-device verification remain required. Other provider buttons open external tools and do not claim account sync.
