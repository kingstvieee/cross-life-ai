# STAARWAARDD Build 109: iPhone-only internal QA.
# Do not start until Apple signing is configured in Codemagic and local
# Build 109 changes are committed to the selected GitHub branch.
workflows:
  staar-iphone-qa-109:
    name: STAARWAARDD 109 - iPhone Internal QA
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events: []
    environment:
      node: 22
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - STAAR_QA109_Codemagic_AdHoc
        certificates:
          - STAAR QA 109 Distribution
      vars:
        STAAR_IPHONE_ONLY_QA: '1'
        EXPO_PUBLIC_GUARDIAN_DEVICE_QA: '1'
        EXPO_PUBLIC_WORLD_COLLISION_QA: '1'
        EXPO_PUBLIC_BACKEND_URL: https://cross-life-ai.emergent.host
    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          corepack enable
          yarn install --frozen-lockfile
      - name: Generate iOS project
        script: |
          cd frontend
          npx expo prebuild --platform ios --non-interactive --clean
      - name: Install CocoaPods
        script: |
          cd frontend/ios
          pod install
      - name: Apply ad hoc signing profiles
        script: |
          cd frontend
          xcode-project use-profiles
      - name: Archive signed internal iPhone IPA
        script: |
          cd frontend
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - frontend/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # Separate App Store Connect signing path. Manual trigger only.
  # This creates a TestFlight INTERNAL-ONLY app build, never an App Store release.
  staar-testflight-110:
    name: STAARWAARDD 110 - Guardian Visual Repair - Internal TestFlight QA
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events: []
    integrations:
      app_store_connect: STAAR Codemagic QA 109
    environment:
      node: 22
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - STAARHub_AppStore_Codemagic_2026_11_20
        certificates:
          - STAAR QA 109 Distribution
      vars:
        STAAR_IPHONE_ONLY_QA: '1'
        EXPO_PUBLIC_GUARDIAN_DEVICE_QA: '1'
        EXPO_PUBLIC_WORLD_COLLISION_QA: '1'
        EXPO_PUBLIC_BACKEND_URL: https://cross-life-ai.emergent.host
    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          corepack enable
          yarn install --frozen-lockfile
      - name: Set unique internal TestFlight build number 110
        script: |
          cd frontend
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'app.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (config.expo.ios.buildNumber !== '109' || config.expo.version !== '1.0.4') {
            throw new Error('Unexpected source version; refuse to overwrite an unreviewed release version');
          }
          config.expo.ios.buildNumber = '110';
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('Internal QA version:', config.expo.version, 'build:', config.expo.ios.buildNumber);
          NODE
      - name: Generate native iOS project
        script: |
          cd frontend
          npx expo prebuild --platform ios --non-interactive --clean
      - name: Install CocoaPods
        script: |
          cd frontend/ios
          pod install
      - name: Configure App Store signed internal-only TestFlight export
        script: |
          cd frontend
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Archive App Store signed iPhone IPA
        script: |
          cd frontend
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - frontend/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
