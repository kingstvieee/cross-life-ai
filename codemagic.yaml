workflows:
  staar-home-reconciliation-preflight:
    name: STAAR Hub — approved-asset-gated IPA (manual, no publishing)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events: []
    integrations:
      app_store_connect: STAAR Codemagic QA 109
    environment:
      groups:
      node: 22
      xcode: 26.6
      ios_signing:
        provisioning_profiles:
          - STAARHub_AppStore_Codemagic_2026_11_20
        certificates:
          - STAAR QA 109 Distribution
      vars:
        EAS_BUILD_PROFILE: preview
        EXPO_PUBLIC_BACKEND_URL: https://cross-life-ai.emergent.host
    scripts:
      - name: Verify approved production asset delivery without staging private QA files
        script: |
          set -eu
          cd frontend
          node --input-type=module <<'NODE'
          import {loadApprovedArmoredGuardianAsset} from './scene-src/approved-guardian-asset.mjs';
          import {loadApprovedWorldAssets,REQUIRED_WORLD_ASSETS} from './scene-src/approved-world-assets.mjs';
          const root=process.cwd()+'/scene-src';
          const guardian=await loadApprovedArmoredGuardianAsset(root);
          const worlds=await loadApprovedWorldAssets(root);
          if(!guardian) throw Error('BLOCKED: approved Guardian GLB and signed receipt absent');
          if(!worlds || Object.keys(worlds).length!==REQUIRED_WORLD_ASSETS.length)
            throw Error('BLOCKED: approved world GLBs and receipts incomplete');
          console.log('Approved Guardian and all world models passed validation');
          NODE
      - name: Require explicitly approved unused post-115 build number
        script: |
          cd frontend
          node - <<'NODE'
          const fs=require('node:fs');
          const n=Number(process.env.STAAR_NEXT_IOS_BUILD);
          if(!Number.isSafeInteger(n)||n<=115) throw Error('Set STAAR_NEXT_IOS_BUILD to an Apple-confirmed unused number above 115');
          const p='app.json',d=JSON.parse(fs.readFileSync(p,'utf8'));
          d.expo.ios.buildNumber=String(n);
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE
      - name: Install dependencies and verify ten-portal home
        script: |
          cd frontend
          corepack enable
          yarn install --frozen-lockfile
          node --test tests/ten-portal-home-contract.test.mjs tests/guardian-audio-visual.test.mjs tests/build111-immersive-hub-home-contract.test.mjs tests/claude-3d-chamber-release-gate.test.mjs
      - name: Native iOS prebuild
        script: |
          cd frontend
          npx expo prebuild --platform ios --non-interactive --clean
      - name: CocoaPods
        script: |
          cd frontend/ios
          pod install
      - name: Set App Store Connect signing
        script: |
          cd frontend
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Archive signed internal-only TestFlight IPA
        script: |
          cd frontend
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - frontend/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
