workflows:
  staar-home-review-114:
    name: STAAR Hub 114 — Ten Portal Home Correction — Internal TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events: []
    integrations:
      app_store_connect: STAAR Codemagic QA 109
    environment:
      groups:
      node: 22
      xcode: 26.6
      ios_signing:
        provisioning_profiles:
          - STAARHub_AppStore_Codemagic_2026_11_20
        certificates:
          - STAAR QA 109 Distribution
      vars:
        EAS_BUILD_PROFILE: preview
        EXPO_PUBLIC_BACKEND_URL: https://cross-life-ai.emergent.host
    scripts:
      - name: Download and authenticate PRIVATE encrypted 3D assets
        script: |
          set -eu
          : "${STAAR_PRIVATE_ASSET_URL:?Configure a private download URL in the staar-private-110 secret group}"
          asset_dir=$(mktemp -d)
          trap 'rm -rf "$asset_dir"' EXIT
          asset="$asset_dir/guardian-worlds.enc"
          expected_sha256=1a9a40835361ce71633c71eab7ac9ac392ec12e3a936397ed718299b4bd6a1d0
          for attempt in 1 2 3; do
            rm -f "$asset"
            if curl --fail --silent --location --proto '=https' --proto-redir '=https' \
                 --connect-timeout 20 --max-time 180 "$STAAR_PRIVATE_ASSET_URL" \
                 --output "$asset" &&
               printf '%s  %s\n' "$expected_sha256" "$asset" | shasum -a 256 --check --status; then
              break
            fi
            echo "Private 3D asset download attempt $attempt failed checksum or transport validation" >&2
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 2))"
          done
          node scripts/decrypt-private-b110.mjs "$asset"
          rm -f "$asset"
          cd frontend
          node scripts/stage-private-guardian-b250-qa.mjs
          node --input-type=module -e "import('./scene-src/internal-ten-world-qa.mjs').then(m=>m.loadInternalTenWorldQaAssets(process.cwd()+'/scene-src').then(w=>{if(Object.keys(w).length!==10)throw Error('ten_worlds_missing');console.log('10 GLBs hash verified')}))"
          node scripts/prepare-private-b250-qa-archive.mjs prepare
      - name: Set iPhone internal review build number 114
        script: |
          cd frontend
          node - <<'NODE'
          const fs=require('node:fs');
          const name='app.json',data=JSON.parse(fs.readFileSync(name,'utf8'));
          if(data.expo.version!=='1.0.4'||data.expo.ios.buildNumber!=='109')
            throw Error('Incorrect base version — refuse to build with duplicate number');
          data.expo.ios.buildNumber='114';
          fs.writeFileSync(name,JSON.stringify(data,null,2)+'\n');
          NODE
      - name: Install dependencies and verify ten-portal home
        script: |
          cd frontend
          corepack enable
          yarn install --frozen-lockfile
          node --test tests/ten-portal-home-contract.test.mjs tests/guardian-audio-visual.test.mjs
      - name: Native iOS prebuild
        script: |
          cd frontend
          npx expo prebuild --platform ios --non-interactive --clean
      - name: CocoaPods
        script: |
          cd frontend/ios
          pod install
      - name: Set App Store Connect signing
        script: |
          cd frontend
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Archive signed internal-only TestFlight IPA
        script: |
          cd frontend
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - frontend/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
